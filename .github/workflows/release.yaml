name: Quick File Upload

permissions:
  contents: write # Add this
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for release"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Zip output
        run: |
          mkdir quick-file-upload
          mkdir quick-file-upload/scripts
          mkdir quick-file-upload/styles
          mkdir quick-file-upload/lang
          cp module.json ./quick-file-upload/
          cp ./styles/*.css ./quick-file-upload/styles/
          cp ./scripts/*.js ./quick-file-upload/scripts/
          cp ./lang/*.* ./quick-file-upload/lang/
          zip -r quick-file-upload.zip quick-file-upload

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Handle both trigger types, github.event.inputs.tag is for getting the tag manual. If not found the automatic tag retrieval is used.
          # input events are only available for manual events aka workflow_dispatch events.
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          gh release create "$tag" \
            --title="Release $tag" \
            --draft \
            module.json quick-file-upload.zip
